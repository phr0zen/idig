            path: /models/{a_model_id}:batchEmbedContents
            verb: POST
      execute:
        - $ref: >-
            interact_google_gemini_llm_proxy:GeminiBatchEmbedContents-4cvi5:1.0.0
    - conditions:
        - verbPath:
            path: /models/{a_model_id}:countTokens
            verb: POST
      execute:
        - $ref: interact_google_gemini_llm_proxy:GeminiCountTokens-4cvi5:1.0.0
    - conditions:
        - verbPath:
            path: /models
            verb: GET
      execute:
        - $ref: interact_google_gemini_llm_proxy:GeminiModels-4cvi5:1.0.0
    - conditions:
        - verbPath:
            path: /models/{a_model_id}
            verb: GET
      execute:
        - $ref: interact_google_gemini_llm_proxy:GeminiModelsId-4cvi5:1.0.0
