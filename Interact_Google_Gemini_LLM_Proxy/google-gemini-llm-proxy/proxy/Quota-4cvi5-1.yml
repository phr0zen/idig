kind: Quota
apiVersion: api.ibm.com/v1
metadata:
  name: gemini-token-weighted-4cvi5
  namespace: interact_google_gemini_llm_proxy
  version: 1.0.0
  tags:
    - DataPowerInteractGateway
    - GoogleGemini
    - llm
    - ai
  description: ''
  domain: ai-platform
spec:
  maxRequest: 10000
  interval: 60s
  extensions:
    dp-nano-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        weightExpr: $variable('aiGeneratedTokenCount')
        exceedAction: return429
        intervalOffset: 0
        dynamicValue: ''
